[project]
name = "monke-observability"
version = "0.1.0"
description = "Shared request, LLM and log instrumentation for Monk-E apps (PostHog)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "posthog>=7",
]

[project.optional-dependencies]
# OpenTelemetry log export to PostHog Logs. Optional: request and LLM events work without it.
otel = [
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monke_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
