# Render Blueprint for the Monk-E admin page. Not applied automatically: create it from the Render
# dashboard (Blueprints → New Blueprint Instance) once the repo is on GitHub. Values marked sync: false
# are entered in the dashboard and never stored here.
services:
  - type: web
    name: monke-admin
    runtime: docker
    dockerfilePath: ./admin/Dockerfile
    dockerContext: .
    plan: free            # sleeps when idle; switch to starter if the first load after idle is too slow
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: POSTHOG_APP_HOST
        value: https://eu.posthog.com
      - key: POSTHOG_PROJECT_ID
        sync: false
      - key: POSTHOG_PERSONAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: PUBLIC_URL
        sync: false
